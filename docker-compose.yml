version: '3.8'

services:
  # 1. ML Service (AI Brain & Groww Execution)
  ml_service:
    build: ./ml_service
    container_name: ml_service
    ports:
      - "8000:8000"
    env_file:
      - ./ml_service/.env
    volumes:
      - ml_models:/app/models/saved_models
      - ml_cache:/app/data/cache
    restart: always

  # 2. Automated Rebalancer Bot
  rebalancer:
    build: ./ml_service
    container_name: ml_rebalancer
    depends_on:
      - ml_service
    env_file:
      - ./ml_service/.env
    # Triggers a rebalancing cycle every hour
    command: ["sh", "-c", "while true; do python auto_rebalancer.py; sleep 3600; done"]
    restart: always

  # 3. Spring Boot Backend (API for your future Frontend)
  trading_backend:
    build: ./trading_backend/trading_backend
    container_name: trading_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://trading_db:5432/trading_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - ML_SERVICE_URL=http://ml_service:8000
    depends_on:
      - trading_db
      - ml_service
    restart: always

  # 4. Database (PostgreSQL)
  trading_db:
    image: postgres:15-alpine
    container_name: trading_db
    environment:
      - POSTGRES_DB=trading_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  ml_models:
  ml_cache:
  postgres_data:
